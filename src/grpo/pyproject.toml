[project]
name = "grpo"
version = "0.1.0"
description = "GRPO training of Qwen2.5-0.5B on GSM8K math reasoning"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "peft==0.19.1",
    "torch==2.13.0",
    "transformers==5.14.1",
    "trl==1.8.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
